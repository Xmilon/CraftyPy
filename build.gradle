plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
    exclude("**/__pycache__/**") // written when the Python tests import the worker
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    mavenCentral()
    // Modern UI artifacts
    maven { url 'https://maven.izzel.io/releases/' }
    // JEI API (optional: the Recipes & drops window draws JEI's own recipe layouts when JEI is installed)
    maven { url 'https://maven.blamejared.com/' }
    // GeckoLib (optional: Python mobs with .geo.json models are drawn by GeckoLib when it is installed)
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Minecraft 1.21 + the CraftPy editor are heap-hungry; give a fork 8 GB.
            jvmArgument('-Xmx8G')
            jvmArgument('-Xms1G')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            jvmArgument('-Xmx4G')
            jvmArgument('-Xms512M')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Modern UI (client UI framework). Compile-only: at runtime the Modern UI mod itself
    // provides these classes. For runClient, drop the ModernUI-NeoForge universal jar
    // (CurseForge/Modrinth, 1.21.1-3.13.0.1) into run/mods.
    // Non-transitive: their icu4j/fastutil versions clash with Minecraft's strict pins, and
    // Minecraft already ships those libraries.
    compileOnly("icyllis.modernui:ModernUI-NeoForge:1.21.1-3.13.0.1") { transitive = false }
    compileOnly("dev.icyllis:modernui-core:3.13.0") { transitive = false }
    compileOnly("dev.icyllis:arc3d-core:2026.2.0") { transitive = false }
    compileOnly("dev.icyllis:arc3d-sketch:2026.2.0") { transitive = false }
    compileOnly("icyllis.modernui:ModernUI-Markflow:3.12.0") { transitive = false }
    compileOnly("org.commonmark:commonmark:0.25.0") { transitive = false }

    // JEI: compile against its API only; at runtime CraftPy uses it only when the JEI mod is installed
    compileOnly("mezz.jei:jei-1.21.1-common-api:19.64.0.455") { transitive = false }
    compileOnly("mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455") { transitive = false }
    // GeckoLib: compile only; CraftPy uses it only when the GeckoLib mod is installed
    compileOnly("software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3") { transitive = false }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // https://www.gradle.org/docs/current/userguide/dependency_management_for_java_projects.html

    // Unit tests for pure (Minecraft-independent) logic such as the asset-reference parser.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Network codec regression tests reference Minecraft interfaces (CustomPacketPayload),
    // so the test source set must also see main's compile/runtime classpath.
    // `files(...)` unwraps the classpath into a plain FileCollection, which is still a valid
    // dependency in Gradle 9 (a bare Configuration is not).
    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // WorkerPythonTest runs these scripts; changing them must re-run the tests.
    inputs.dir('src/test/python')
    // The moddev plugin keeps the main classpath for tests; keep tests independent of MC.
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Standalone installer (plain Java, no Minecraft): ./gradlew installerJar -> build/libs/craftpy-installer.jar.
// The built mod jar is bundled inside it as craftpy.jar.
sourceSets {
    installer {
        java.srcDir 'installer/java'
        resources.srcDir 'installer/resources'
    }
}

// ---- The Python players get with the mod: python-build-standalone (CPython built to run from any folder), one archive
// per platform in the jar under craftpy_python/, pinned by release and SHA-256. BundledPython unpacks the one of the
// player's computer on first start. -Pcraftpy.bundlePython=false builds without it (offline, smaller jar).
def pythonRelease = '20260929'
def pythonVersion = '3.13.15'
def pythonRuntimes = [
        'x86_64-pc-windows-msvc'   : 'd11d0d4b4fefa5df09e925dbd37600457f5488a9712a82f3f0dd1ff9431c2ccf',
        'x86_64-unknown-linux-gnu' : 'c552deaf9ed0e678dee4ccc760d6dcd7cab33f1bd43e8037123b4a4db8508e14',
        'aarch64-unknown-linux-gnu': '3807936bef22d3e347454df4f8774c786f98c7caa5e7328425e7b40766a9cff8',
        'x86_64-apple-darwin'      : '73b503a2d3f47f0601265d7936744b77dc4ee75d2a3e88a470594a014dcf6822',
        'aarch64-apple-darwin'     : 'd66c67f16148c7454b1509c32747175f7669c8b8e105b97b92a0000d66af6e6e',
]
def pythonDir = layout.buildDirectory.dir('python-runtimes')
def bundlePython = (findProperty('craftpy.bundlePython') ?: 'true').toString() != 'false'

def downloadPython = tasks.register('downloadPython') {
    group = 'craftpy'
    description = 'Downloads the pinned Python runtimes the mod jar ships (checked against their SHA-256).'
    def out = pythonDir.get().asFile
    inputs.property('release', pythonRelease + '/' + pythonVersion)
    inputs.property('runtimes', pythonRuntimes)
    outputs.dir(out)
    doLast {
        out.mkdirs()
        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { stream ->
                byte[] buffer = new byte[1 << 16]
                int read
                while ((read = stream.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().encodeHex().toString()
        }
        def http = java.net.http.HttpClient.newBuilder().followRedirects(java.net.http.HttpClient.Redirect.NORMAL).build()
        pythonRuntimes.each { platform, expected ->
            def file = new File(out, platform + '.tar.gz')
            if (file.exists() && sha256(file) == expected) {
                return
            }
            def url = "https://github.com/astral-sh/python-build-standalone/releases/download/${pythonRelease}/" +
                    "cpython-${pythonVersion}%2B${pythonRelease}-${platform}-install_only_stripped.tar.gz"
            def part = new File(out, platform + '.tar.gz.part')
            println "Downloading Python ${pythonVersion} for ${platform}"
            def response = http.send(java.net.http.HttpRequest.newBuilder(URI.create(url)).build(),
                    java.net.http.HttpResponse.BodyHandlers.ofFile(part.toPath()))
            if (response.statusCode() != 200) {
                part.delete()
                throw new GradleException("Python download failed (HTTP ${response.statusCode()}): ${url}")
            }
            def actual = sha256(part)
            if (actual != expected) {
                part.delete()
                throw new GradleException("Python for ${platform} has SHA-256 ${actual}, expected ${expected}: not used")
            }
            java.nio.file.Files.move(part.toPath(), file.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        def index = new StringBuilder('# The Python runtimes in this jar (python-build-standalone ' + pythonRelease + ')\n')
        index.append('version=').append(pythonVersion).append('+').append(pythonRelease).append('\n')
        pythonRuntimes.each { platform, sha -> index.append(platform).append('.sha256=').append(sha).append('\n') }
        new File(out, 'runtimes.properties').text = index.toString()
    }
}

tasks.named('jar', Jar) {
    if (bundlePython) {
        dependsOn downloadPython
        from(pythonDir) {
            into 'craftpy_python'
            include '*.tar.gz', 'runtimes.properties'
        }
    }
}

// The small download: the same mod without the five Python runtimes (players install Python 3.13 themselves, see
// dist/INSTALL.md). The install scripts and instructions are copied next to the jars.
def liteJar = tasks.register('liteJar', Jar) {
    group = 'build'
    description = 'Builds craftpy-<version>-no-python.jar (no bundled Python) next to the normal jar.'
    dependsOn tasks.named('jar')
    archiveClassifier = 'no-python'
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'craftpy_python/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'distScripts'
}
tasks.register('distScripts', Copy) {
    group = 'build'
    description = 'Copies install-python.cmd / .sh and INSTALL.md next to the jars.'
    from layout.projectDirectory.dir('dist')
    include 'install-python.cmd', 'install-python.sh', 'INSTALL.md'
    into layout.buildDirectory.dir('libs')
}
tasks.named('build') { dependsOn liteJar }

// One jar per system (craftpy-<version>-windows / -macos / -linux.jar): only that system's Python inside, so each
// stays under the 100 MB that Modrinth and CurseForge accept. Its runtimes.properties lists only its platforms; on
// another system BundledPython finds no entry and the mod uses the Python on PATH, like the no-python jar.
def pythonJarSystems = [
        windows: ['x86_64-pc-windows-msvc'],
        macos  : ['x86_64-apple-darwin', 'aarch64-apple-darwin'],
        linux  : ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu'],
]
def systemJars = []
def systemInstallers = []
pythonJarSystems.each { system, platforms ->
    def indexDir = layout.buildDirectory.dir("python-index/${system}").get().asFile
    def indexText = "# The Python runtimes in this jar (python-build-standalone ${pythonRelease}, ${system})\n" +
            "version=${pythonVersion}+${pythonRelease}\n" +
            platforms.collect { "${it}.sha256=${pythonRuntimes[it]}\n" }.join('')
    def index = tasks.register("pythonIndex${system.capitalize()}") {
        inputs.property('text', indexText)
        outputs.dir(indexDir)
        doLast {
            indexDir.mkdirs()
            new File(indexDir, 'runtimes.properties').text = indexText
        }
    }
    def systemJar = tasks.register("${system}Jar", Jar) {
        group = 'build'
        description = "Builds craftpy-<version>-${system}.jar (only the ${system} Python inside)."
        dependsOn tasks.named('jar'), downloadPython, index
        archiveClassifier = system
        from(zipTree(tasks.named('jar').flatMap { it.archiveFile })) {
            exclude 'craftpy_python/**'
        }
        from(pythonDir) {
            into 'craftpy_python'
            include platforms.collect { it + '.tar.gz' }
        }
        from(indexDir) {
            into 'craftpy_python'
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        mustRunAfter 'distScripts'
    }
    systemJars << systemJar
    systemInstallers << tasks.register("installerJar${system.capitalize()}", Jar) {
        group = 'build'
        description = "Builds craftpy-installer-${system}.jar (installs the ${system} jar)."
        archiveBaseName = 'craftpy-installer'
        archiveVersion = ''
        archiveClassifier = system
        from sourceSets.installer.output
        from(systemJar) { rename { 'craftpy.jar' } }
        manifest { attributes 'Main-Class': 'net.xmilon.craftpy.installer.InstallerMain' }
        mustRunAfter 'distScripts'
    }
}
tasks.named('build') { dependsOn systemJars }

tasks.register('installerJar', Jar) {
    group = 'build'
    archiveBaseName = 'craftpy-installer'
    archiveVersion = ''
    from sourceSets.installer.output
    from(tasks.named('jar')) { rename { 'craftpy.jar' } }
    manifest { attributes 'Main-Class': 'net.xmilon.craftpy.installer.InstallerMain' }
    mustRunAfter 'distScripts' // both write build/libs; Gradle refuses `build installerJar` without an order
    dependsOn systemInstallers // and the small installers, one per system
}

dependencies {
    testImplementation sourceSets.installer.output
}

// ---- Standalone IDE (M18): the editor in its own window, no game. The game's own classes stay on the classpath but are
// never bootstrapped; Modern UI is a compile-only mod dependency, so its jars are added here.
configurations {
    ideRuntime
}
dependencies {
    ideRuntime("icyllis.modernui:ModernUI-NeoForge:1.21.1-3.13.0.1") { transitive = false }
    ideRuntime("dev.icyllis:modernui-core:3.13.0") { transitive = false }
    for (String part : ['core', 'sketch', 'compiler', 'engine', 'granite', 'opengl', 'vulkan']) {
        ideRuntime("dev.icyllis:arc3d-${part}:2026.2.0") { transitive = false }
    }
    ideRuntime("icyllis.modernui:ModernUI-Markflow:3.12.0") { transitive = false }
    ideRuntime("org.commonmark:commonmark:0.25.0") { transitive = false }
}
tasks.register('runIde', JavaExec) {
    group = 'craftpy'
    description = 'Opens the CraftPy IDE without Minecraft, on the run/ folder (or -PcraftpyHome=<game folder>).'
    classpath = sourceSets.main.runtimeClasspath + configurations.ideRuntime
    mainClass = 'net.xmilon.craftpy.ide.IdeMain'
    def home = project.hasProperty('craftpyHome') ? project.property('craftpyHome') : file('run').absolutePath
    systemProperty 'craftpy.home', home
    for (String key : ['craftpy.ide.page', 'craftpy.ide.exitAfter']) {
        if (project.hasProperty(key)) {
            systemProperty key, project.property(key)
        }
    }
    jvmArgs '-Xmx1G'
}
tasks.register('ideSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Starts the standalone IDE without its window (it exits 0 once "CraftPy IDE ready" is printed).'
    classpath = sourceSets.main.runtimeClasspath + configurations.ideRuntime
    mainClass = 'net.xmilon.craftpy.ide.IdeMain'
    systemProperty 'craftpy.home', layout.buildDirectory.dir('ide-smoke').get().asFile.absolutePath
    systemProperty 'craftpy.ide.smoke', 'true'
}

// One-click IDE: build/ide/ holds "CraftPy IDE.jar" (a launcher whose manifest lists lib/), the libraries, a .bat / .sh
// that start it with the right Java and craftpy-ide.properties (home = the game folder). ideShortcut adds a desktop
// shortcut on Windows.
def ideDistDir = layout.buildDirectory.dir('ide')
def ideLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }

def ideLibs = tasks.register('ideLibs', Sync) {
    group = 'craftpy'
    description = 'Copies the libraries of the standalone IDE into build/ide/lib.'
    into ideDistDir.map { it.dir('lib') }
    from(tasks.named('jar'))
    from(sourceSets.main.runtimeClasspath.filter { it.isFile() && it.name.endsWith('.jar') })
    from(configurations.ideRuntime)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('ideDist') {
    group = 'craftpy'
    description = 'Builds build/ide: double-click "CraftPy IDE.bat" (or the jar) to open the IDE without the game.'
    dependsOn ideLibs
    def out = ideDistDir.get().asFile
    def runHome = file('run').absolutePath
    def icon = file('src/main/resources/assets/craftpy/icon/craftpy.ico')
    def java = ideLauncher.map { it.executablePath.asFile.absolutePath }
    outputs.dir(out)
    doLast {
        def lib = new File(out, 'lib')
        def jars = (lib.listFiles() ?: new File[0]).findAll { it.name.endsWith('.jar') }.sort { it.name }
        def manifest = new java.util.jar.Manifest()
        manifest.mainAttributes.putValue('Manifest-Version', '1.0')
        manifest.mainAttributes.putValue('Main-Class', 'net.xmilon.craftpy.ide.IdeMain')
        manifest.mainAttributes.putValue('Class-Path', jars.collect { 'lib/' + it.name.replace(' ', '%20') }.join(' '))
        new File(out, 'CraftPy IDE.jar').withOutputStream { stream ->
            new java.util.jar.JarOutputStream(stream, manifest).close()
        }
        def properties = new File(out, 'craftpy-ide.properties')
        if (!properties.exists()) { // kept when you changed it
            properties.text = "# The game folder the IDE works on (the folder that has pyforge/ in it).\n" +
                    "# Your Minecraft folder is used when this line is removed and CraftPy has run there.\n" +
                    "home=" + runHome.replace('\\', '/') + "\n"
        }
        def javaw = new File(new File(java.get()).parentFile, 'javaw.exe')
        def windowsJava = javaw.exists() ? javaw.absolutePath : 'javaw'
        new File(out, 'CraftPy IDE.bat').text = "@echo off\r\n" +
                "rem Starts the CraftPy IDE without a console window. Built by gradlew ideDist.\r\n" +
                "start \"CraftPy IDE\" \"" + windowsJava + "\" -Xmx1G -jar \"%~dp0CraftPy IDE.jar\" %*\r\n"
        def sh = new File(out, 'craftpy-ide.sh')
        sh.text = "#!/bin/sh\n# Starts the CraftPy IDE. Built by gradlew ideDist.\n" +
                "cd \"\$(dirname \"\$0\")\" && exec \"" + java.get().replace('\\', '/') + "\" -Xmx1G -jar \"CraftPy IDE.jar\" \"\$@\"\n"
        sh.setExecutable(true)
        java.nio.file.Files.copy(icon.toPath(), new File(out, 'craftpy.ico').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        println "CraftPy IDE ready in " + out + "  -  double-click \"CraftPy IDE.bat\""
    }
}

tasks.register('ideShortcut') {
    group = 'craftpy'
    description = 'Windows: puts a "CraftPy IDE" shortcut with the CraftPy icon on the desktop (runs ideDist first).'
    dependsOn 'ideDist'
    def out = ideDistDir.get().asFile
    def java = ideLauncher.map { it.executablePath.asFile.absolutePath }
    doLast {
        if (!System.getProperty('os.name', '').startsWith('Windows')) {
            println 'Desktop shortcuts are made on Windows only; start build/ide/craftpy-ide.sh instead.'
            return
        }
        def javaw = new File(new File(java.get()).parentFile, 'javaw.exe').absolutePath
        def jar = new File(out, 'CraftPy IDE.jar').absolutePath
        def ico = new File(out, 'craftpy.ico').absolutePath
        // a script file: quotes inside -Command arguments do not survive Windows' command line rules
        def ps1 = new File(out, 'make-shortcut.ps1')
        ps1.text = '$s = (New-Object -ComObject WScript.Shell).CreateShortcut([Environment]::GetFolderPath("Desktop") + "\\CraftPy IDE.lnk")\r\n' +
                '$s.TargetPath = "' + javaw + '"\r\n' +
                '$s.Arguments = \'-Xmx1G -jar "' + jar + '"\'\r\n' +
                '$s.WorkingDirectory = "' + out.absolutePath + '"\r\n' +
                '$s.IconLocation = "' + ico + '"\r\n' +
                '$s.Description = "CraftPy IDE"\r\n' +
                '$s.Save()\r\n'
        def process = new ProcessBuilder('powershell', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
                '-File', ps1.absolutePath).inheritIO().start()
        if (process.waitFor() != 0) {
            throw new GradleException('Could not create the desktop shortcut')
        }
        println 'Desktop shortcut "CraftPy IDE" created'
    }
}
